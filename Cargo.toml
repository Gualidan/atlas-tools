[workspace]
resolver = "3"
members = ["atlas", "crates/common","sisyphus"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.26"
tar = "0.4.46"
zstd = "0.14.0"
ring = { version = "0.17.14", features = ["std"] }
serde-saphyr = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
common = { path = "crates/common" }
which = "8.0.5"
reqwest = { version = "0.13.4", features = ["blocking"] }
semver = "1.0.28"
walkdir = "2.5.0"
rusqlite = "0.40.2"
anyhow = "1.0.104"
tempfile = "3.27.0"
whoami = "2.1.3"
hex = "0.4.3"
rustix = "1.1.5"
inquire = "0.9.4"
